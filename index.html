    <title>Meridian Construction Group | Commercial & Residential Builders</title>
    <meta
      name="description"
      content="Meridian Construction Group delivers commercial, residential, and industrial construction projects on time and on budget. Licensed, insured, and built on trust."
    />

         react-helmet-async, and a root href="/" here crashes `vite build` on this

         to open the project root as a file). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meridian Construction Group" />
    <meta property="og:title" content="Meridian Construction Group | Commercial & Residential Builders" />
    <meta property="og:description" content="Licensed, insured construction company delivering commercial, residential, and industrial projects on time and on budget." />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#1a1d21" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
